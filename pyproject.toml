[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arc-llama"
version = "0.1.0"
description = "Plug-and-play llama.cpp runtime for Intel Arc GPUs. Auto-detects your card, picks safe SYCL defaults, and exposes an OpenAI-compatible API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["llama.cpp", "intel", "arc", "sycl", "llm", "inference", "battlemage", "alchemist"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "tomli>=2.0; python_version<'3.11'",
    "tomli-w>=1.0",
    "rich>=13.0",
    "huggingface-hub>=0.20",
]

[project.optional-dependencies]
tui = [
    "textual>=0.60",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "textual>=0.60",
    "build>=1.2",
]

[project.scripts]
arc-llama = "arc_llama.cli:main"

[project.urls]
Homepage = "https://github.com/offbyonebit/arc-llama"
Issues = "https://github.com/offbyonebit/arc-llama/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/arc_llama"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
