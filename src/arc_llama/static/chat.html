<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chat: arc-llama</title>
<link rel="icon" type="image/png" href="/assets/arc-llama-logo.png?v=ui-0.15" />

<link rel="stylesheet" href="/chat.css?v=ui-0.17" />
<script src="/vendor/marked-12.0.2.min.js"></script>
<script src="/vendor/highlight-11.9.0.min.js"></script>
<link rel="stylesheet" href="/vendor/github-dark-11.9.0.min.css" />
</head>
<body>
<header>
  <div class="brand">
    <img class="brand-logo" src="/assets/arc-llama-logo.png?v=ui-0.15" data-light-src="/assets/arc-llama-logo.png?v=ui-0.15" data-dark-src="/assets/arc-llama-logo-dark.png?v=ui-0.15" alt="Arc Llama logo" width="42" height="42" />
    <h1>arc-llama</h1>
    <span class="tagline">Chat</span>
  </div>
  <div class="meta">
    <button id="theme-toggle" class="ghost theme-toggle" type="button" aria-label="Switch to light theme">Light theme</button>
    <a class="manager-link" href="/">Model Manager &rarr;</a>
  </div>
</header>

<div class="model-bar">
  <select id="model-select" class="model-select"></select>
  <div id="model-status" class="model-status loading">
    <span class="indicator"></span>
    <span id="status-text">loading models</span>
  </div>
</div>

<main id="chat-log">
  <div class="empty-state" id="empty-state">
    <div class="icon"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></div>
    <div class="title">Start a conversation</div>
    <div class="hint">Select a model and send a message to begin chatting with arc-llama.</div>
  </div>
</main>

<div class="ctx-meter" id="ctx-meter">
  <div class="ctx-bar-track"><div class="ctx-bar-fill" id="ctx-bar-fill"></div></div>
  <div class="ctx-label">
    <span id="ctx-label-left">context</span>
    <span id="ctx-label-tps" class="ctx-tps"></span>
    <span id="ctx-label-right"></span>
  </div>
</div>

<div class="input-area">
  <div class="input-wrap" id="input-wrap">
    <input type="file" id="pdf-input" accept=".pdf,.txt,.md,.py,.json,.yaml,.yml,.csv,text/plain,application/pdf" multiple />
    <button id="attach-button" aria-label="Attach file" title="Attach file">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
        <path d="M16.5 6v11.5c0 2.5-2 4.5-4.5 4.5s-4.5-2-4.5-4.5V5c0-1.7 1.3-3 3-3s3 1.3 3 3v11.5c0 0.8-0.7 1.5-1.5 1.5s-1.5-0.7-1.5-1.5V6h-2v10.5c0 1.9 1.6 3.5 3.5 3.5s3.5-1.6 3.5-3.5V5c0-2.8-2.2-5-5-5s-5 2.2-5 5v12.5c0 3.6 2.9 6.5 6.5 6.5s6.5-2.9 6.5-6.5V6h-2z"/>
      </svg>
    </button>
    <div id="attachment-strip"></div>
    <textarea id="message-input" rows="1" placeholder="Message arc-llama…"></textarea>
    <button id="send-button" aria-label="Send">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
    <div id="command-palette" class="command-palette" role="listbox" aria-label="Slash commands"></div>
  </div>
  <div class="hint" id="chat-hint">Enter to send · Shift+Enter for a new line</div>
</div>

<button id="history-toggle" aria-label="Chat history" title="Chat history">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
    <path d="M13 3a9 9 0 1 0 7.78 13.56l1.42 1.42A10.93 10.93 0 0 1 13 24C5.93 24 0 18.07 0 11S5.93 0 13 0c.55 0 1 .45 1 1s-.45 1-1 1z"/>
    <path d="M12.5 5.5v6.09l4.42 2.63-.78 1.26-5.14-3.06V5.5z"/>
  </svg>
</button>

<div id="history-panel">
  <div class="h-title">Chat History</div>
  <div class="h-folder-bar">
    <select id="h-folder" aria-label="Select folder"></select>
    <button id="h-new-folder" class="h-folder-add" title="New folder">+</button>
  </div>
  <button class="h-new" id="h-new">New Chat</button>
  <div class="h-actions">
    <button class="h-action" id="h-export">Export</button>
    <button class="h-action" id="h-import">Import</button>
    <input type="file" id="h-import-input" accept="application/json,.json" style="display:none" />
  </div>
  <div class="h-list" id="h-list"></div>
</div>

<button id="settings-toggle" aria-label="Model settings" title="Model settings">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
    <path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
  </svg>
</button>

<div id="settings-panel">
  <div>
    <div class="s-title">Model Settings</div>
    <div class="s-model-name" id="s-model-name">Not selected</div>
  </div>
  <div id="s-fields"></div>
  <div class="s-feedback" id="s-feedback"></div>
</div>

    <script src="/markdown_safety.js?v=ui-0.14"></script>
    <script src="/chat.js?v=ui-0.15"></script>
</body>
</html>
