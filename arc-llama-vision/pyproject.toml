[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arc-llama-vision"
version = "0.1.0"
description = "Optional image-generation companion service for arc-llama."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["arc-llama", "image-generation", "companion", "openai-compatible"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/offbyonebit/arc-llama"
Issues = "https://github.com/offbyonebit/arc-llama/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/arc_llama_vision"]