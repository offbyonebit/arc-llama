name: CI

on:
  push:
    branches: [main, feature/model-journey-and-organization]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src tests scripts registry-repo/scripts

      - name: Check browser scripts
        run: |
          node --check browser-tests/installed-work-retry-smoke.mjs
          node --check browser-tests/installed-work-smoke.mjs
          node --check browser-tests/work-cases.mjs
          node --check src/arc_llama/static/work.js
          node --check browser-tests/installed-smoke.mjs
          node --check browser-tests/release-cases.mjs
          node --check browser-tests/compaction-cases.mjs
          node --check src/arc_llama/static/chat/compaction.js
          node --check browser-tests/run.mjs
          node --check browser-tests/harness.mjs
          node --check browser-tests/chat-cases.mjs
          node --check browser-tests/dashboard-cases.mjs
          node --check browser-tests/library-cases.mjs
          node --check src/arc_llama/static/app.js
          node --check src/arc_llama/static/dashboard/library.js
          node --check src/arc_llama/static/dashboard/measurements.js
          node --check src/arc_llama/static/dashboard/plugins.js
          node --check src/arc_llama/static/dashboard/integration.js
          node --check src/arc_llama/static/chat.js
          node --check src/arc_llama/static/chat/rendering.js
          node --check src/arc_llama/static/chat/attachments.js
          node --check src/arc_llama/static/chat/settings.js
          node --check src/arc_llama/static/chat/history.js
          node --check src/arc_llama/static/markdown_safety.js
          node --check src/arc_llama/static/vendor/marked-12.0.2.min.js
          node --check src/arc_llama/static/vendor/highlight-11.9.0.min.js

      - name: Type-check with mypy
        run: mypy --check-untyped-defs src

      - name: Test with pytest
        # Print every skip reason so an environment change cannot hide missing
        # coverage in an otherwise green job.
        run: pytest tests/ -W error -q -ra --tb=short -p no:cacheprovider

  browser-tests:
    # Real-browser regression suite for the bundled web UI. Kept separate
    # from the Python matrix: it installs playwright in browser-tests/
    # only, runs the repository's real static files against headless
    # Chrome, and mocks every arc-llama API endpoint deterministically.
    name: Browser UI regression (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install playwright (sandboxed in browser-tests/)
        run: npm ci --no-audit --no-fund
        working-directory: browser-tests

      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
        working-directory: browser-tests

      - name: Run browser regression suite
        run: node run.mjs
        working-directory: browser-tests

  bare-install:
    timeout-minutes: 15
    # The main job installs every dev dependency, so it cannot catch optional
    # imports or package-data failures that only affect a normal user install.
    name: Bare wheel install on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up oldest supported Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build wheel and source distribution
        run: |
          python -m pip install --quiet build
          python -m build

      - name: Install wheel without extras
        run: python -m pip install --quiet dist/*.whl

      - name: Confirm optional extras are absent
        run: |
          python - <<'PY'
          import importlib.util
          import sys

          present = [
              name for name in ("textual", "fastembed", "mcp")
              if importlib.util.find_spec(name) is not None
          ]
          if present:
              sys.exit(f"optional extras present; bare-install check is invalid: {present}")
          PY

      - name: Smoke-test installed CLI and package data
        run: |
          cd "$(mktemp -d)"
          arc-llama --version
          arc-llama --help
          arc-llama run --help
          arc-llama serve --help
          arc-llama init --help
          arc-llama install-runtime --help
          arc-llama scan --help
          arc-llama recipes --help
          python - <<'PY'
          from importlib import resources
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          from arc_llama import __version__
          from arc_llama.server import create_app

          assert create_app(plugins=[]).version == __version__
          assert resources.files("arc_llama").joinpath("static/index.html").is_file()
          assert resources.files("arc_llama").joinpath("static/markdown_safety.js").is_file()
          assert resources.files("arc_llama").joinpath("static/vendor/marked-12.0.2.min.js").is_file()
          assert resources.files("arc_llama").joinpath("static/vendor/highlight-11.9.0.min.js").is_file()
          assert resources.files("arc_llama").joinpath("data/recipes.json").is_file()
          class Assets(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  target = values.get("src") if tag == "script" else values.get("href") if tag == "link" and values.get("rel") == "stylesheet" else None
                  if target and target.startswith("/"):
                      path = urlsplit(target).path.lstrip("/")
                      assert resources.files("arc_llama").joinpath("static", path).is_file(), path
          for page in ("index.html", "chat.html", "work.html"):
              Assets().feed(resources.files("arc_llama").joinpath("static", page).read_text(encoding="utf-8"))
          PY
