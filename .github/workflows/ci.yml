name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src tests registry-repo/scripts

      - name: Check browser scripts
        run: |
          node --check src/arc_llama/static/app.js
          node --check src/arc_llama/static/chat.js
          node --check src/arc_llama/static/markdown_safety.js
          node --check src/arc_llama/static/vendor/marked-12.0.2.min.js
          node --check src/arc_llama/static/vendor/highlight-11.9.0.min.js

      - name: Type-check with mypy
        run: mypy --check-untyped-defs src

      - name: Test with pytest
        # Print every skip reason so an environment change cannot hide missing
        # coverage in an otherwise green job.
        run: pytest tests/ -q -ra --tb=short -p no:cacheprovider

  bare-install:
    # The main job installs every dev dependency, so it cannot catch optional
    # imports or package-data failures that only affect a normal user install.
    name: Bare wheel install on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up oldest supported Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build wheel and source distribution
        run: |
          python -m pip install --quiet build
          python -m build

      - name: Install wheel without extras
        run: python -m pip install --quiet dist/*.whl

      - name: Confirm optional extras are absent
        run: |
          python - <<'PY'
          import importlib.util
          import sys

          present = [
              name for name in ("textual", "fastembed", "mcp")
              if importlib.util.find_spec(name) is not None
          ]
          if present:
              sys.exit(f"optional extras present; bare-install check is invalid: {present}")
          PY

      - name: Smoke-test installed CLI and package data
        run: |
          cd "$(mktemp -d)"
          arc-llama --version
          arc-llama --help
          arc-llama run --help
          arc-llama serve --help
          arc-llama init --help
          arc-llama install-runtime --help
          arc-llama scan --help
          arc-llama recipes --help
          python - <<'PY'
          from importlib import resources
          from arc_llama import __version__
          from arc_llama.server import create_app

          assert create_app(plugins=[]).version == __version__
          assert resources.files("arc_llama").joinpath("static/index.html").is_file()
          assert resources.files("arc_llama").joinpath("static/markdown_safety.js").is_file()
          assert resources.files("arc_llama").joinpath("static/vendor/marked-12.0.2.min.js").is_file()
          assert resources.files("arc_llama").joinpath("static/vendor/highlight-11.9.0.min.js").is_file()
          assert resources.files("arc_llama").joinpath("data/recipes.json").is_file()
          PY
